<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岩芯薄片显微照片索引台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="mast">
      <div>
        <p>Petrographic Slide Index</p>
        <h1>岩芯薄片显微照片索引台</h1>
      </div>
      <div class="mast-actions">
        <button id="rosterBtn" type="button" class="btn-secondary">矿物名册</button>
        <button id="exportBtn" type="button">导出观察清单</button>
      </div>
    </header>

    <section class="layout">
      <form id="sampleForm" class="editor">
        <h2>样本录入</h2>
        <label>显微照片<input id="photoInput" type="file" accept="image/*"></label>
        <label>样本编号<input name="code" required placeholder="BX-17-03"></label>
        <label>采样地点<input name="location" placeholder="剖面东侧第二层"></label>
        <div class="pair">
          <label>放大倍数<input name="magnification" placeholder="40x"></label>
          <label>偏光类型
            <select name="polarization">
              <option>单偏光</option>
              <option>正交偏光</option>
              <option>反射光</option>
            </select>
          </label>
        </div>
        <label class="mineral-label">主要矿物
          <div class="mineral-picker" id="mineralPicker">
            <div class="mineral-chips" id="mineralChips"></div>
            <input id="mineralInput" placeholder="选择标准名，或输入现场写法" autocomplete="off">
            <div class="suggest" id="mineralSuggest" hidden></div>
          </div>
        </label>
        <label>颗粒结构<input name="texture" placeholder="半自形粒状、碎裂结构"></label>
        <label>老师批注<textarea name="comment" rows="4" placeholder="记录鉴定依据或疑点"></textarea></label>
        <button type="submit">保存样本</button>
      </form>

      <section class="board">
        <div class="filters">
          <div class="multiselect" id="mineralFilter">
            <button type="button" class="multiselect-btn" id="mineralFilterBtn">按矿物筛选（全部命中）</button>
            <div class="multiselect-pop" id="mineralFilterPop" hidden></div>
          </div>
          <select id="polarFilter">
            <option value="">全部偏光</option>
            <option>单偏光</option>
            <option>正交偏光</option>
            <option>反射光</option>
          </select>
        </div>
        <div id="sampleGrid" class="sample-grid"></div>
      </section>

      <aside class="compare">
        <h2>并排对比</h2>
        <div id="comparePane" class="compare-pane"></div>
      </aside>
    </section>
  </main>

  <dialog id="rosterDialog" class="roster-dialog">
    <div class="dialog-head">
      <h2>组内矿物名册</h2>
      <button type="button" id="rosterCloseBtn" class="btn-secondary">关闭</button>
    </div>
    <p class="dialog-hint">录入与筛选都使用标准名；现场写法（如 Qz、石英颗粒）登记为同义词后随标准名归并。合并标准名时旧样本保留原写法，筛选与导出自动归到新标准名。</p>
    <form id="rosterAddForm" class="roster-add">
      <input id="rosterAddInput" placeholder="新增标准矿物名，如：石榴子石">
      <button type="submit">添加标准名</button>
    </form>
    <div id="rosterList" class="roster-list"></div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
